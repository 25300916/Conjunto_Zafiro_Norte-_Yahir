    <link rel="stylesheet" href="assets/styles.css">
</head>
<body>

    <div class="container">
        <a class="navbar-brand" href="index.html">Zafiro Norte</a>
        <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>

            </ul>
        </div>

</nav>

<header class="encabezado-pagina text-center">
    <div class="container">
        <h1>Agenda tu evento</h1>
        <p>Cuéntanos qué celebración tienes en mente.</p>
    </div>
</header>

<main class="container my-5">
    <div class="row align-items-center g-4">
        <div class="col-md-5">
            <img src="assets/imagenes/evento-2.png"
                 alt="Presentación de Conjunto Zafiro Norte"
                 class="img-fluid rounded"
                 onerror="this.style.display='none'">
        </div>
        <div class="col-md-7">
            <h2>Solicita una fecha</h2>
            <p>Completa el formulario para consultar la disponibilidad del conjunto.</p>
            <form id="formAgenda" class="formulario-web">
                <label for="nombreAgenda" class="form-label">Nombre completo</label>
                <input type="text" id="nombreAgenda" class="form-control mb-3" required>
                <label for="fechaEvento" class="form-label">Fecha del evento</label>
                <input type="date" id="fechaEvento" class="form-control mb-3" required>
                <label for="tipoEventoAgenda" class="form-label">Tipo de evento</label>
                <select id="tipoEventoAgenda" class="form-select mb-3" required>
                    <option value="">Selecciona una opción</option>
                    <option>Boda</option>
                    <option>Fiesta</option>
                    <option>Evento privado</option>
                    <option>Evento social</option>
                </select>
                <label for="lugarEvento" class="form-label">Lugar del evento</label>
                <input type="text" id="lugarEvento" class="form-control mb-3" required>
                <label for="comentariosAgenda" class="form-label">Detalles adicionales</label>
                <textarea id="comentariosAgenda" class="form-control mb-3" rows="3"></textarea>
                <button type="submit" class="btn btn-dorado">Enviar solicitud</button>
            </form>
        </div>
    </div>
</main>
<footer class="footer text-center">
    <p>© <span id="anioActual"></span> Conjunto Zafiro Norte</p>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
